services:
  - type: web
    name: seatsync-backend
    env: docker
    plan: free
    region: oregon
    rootDir: server
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://seatsync-vjgetntqa-zap-i.vercel.app,https://seatsync.vercel.app
      - key: CLIENT_URL
        value: https://seatsync-vjgetntqa-zap-i.vercel.app
      - key: FRONTEND_URL
        value: https://seatsync-vjgetntqa-zap-i.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@seatsync.edu
      - key: SEED_DEMO_DATA
        value: "false"
